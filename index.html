<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remaining Money Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14231c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f5f1;--card:#fff;--ink:#14231c;--mute:#5d6e65;--line:#d9e1db;--accent:#1f7a4d;--bad:#c0392b;--hero:#14231c;--heroink:#f2f5f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--card:#17221c;--ink:#e8efe9;--mute:#8fa297;--line:#26352d;--accent:#4cc98a;--bad:#ff7a6b;--hero:#e8efe9;--heroink:#0e1612;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1612;--card:#17221c;--ink:#e8efe9;--mute:#8fa297;--line:#26352d;--accent:#4cc98a;--bad:#ff7a6b;--hero:#e8efe9;--heroink:#0e1612;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.1rem;font-weight:600;margin:4px 0 16px;color:var(--mute)}
.hero{background:var(--hero);color:var(--heroink);border-radius:20px;padding:24px 20px;margin-bottom:16px}
.hero small{opacity:.7;font-size:.9rem}
.big{font-size:clamp(2rem,11vw,3rem);font-weight:800;letter-spacing:-.02em;word-break:break-all;margin:4px 0 12px}
.big.neg{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:rgba(127,127,127,.3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.bar.over i{background:var(--bad)}
.meta{display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:6px}
input{width:100%;font:inherit;font-size:1.05rem;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px}
.row input:first-child{flex:2}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--mute);padding:6px 10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li span:first-child{overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mute);font-size:.9rem;padding:4px 0}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.head b{font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>Remaining money calculator</h1>

  <section class="hero" aria-live="polite">
    <small>Money left</small>
    <div class="big" id="left">0.00</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="meta"><span id="spentTxt">Spent 0.00</span><span id="pct">0% used</span></div>
  </section>

  <div class="card">
    <label for="start">Money I have (ETB)</label>
    <input id="start" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 10000">
  </div>

  <div class="card">
    <label for="amt">Amount spent (ETB)</label>
    <input id="amt" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 250">
    <label for="name" style="margin-top:12px">What did you spend it on? (optional)</label>
    <input id="name" type="text" maxlength="60" placeholder="e.g. Lunch, transport, data pack">
    <div class="row" style="margin-top:12px"><button id="add" style="flex:1">Add expense</button></div>
  </div>

  <div class="card">
    <div class="head"><b>Expenses</b><button class="ghost" id="clear">Clear all</button></div>
    <ul id="list"></ul>
    <div class="empty" id="empty">Nothing spent yet.</div>
  </div>
</main>

<script>
(function(){
  var items=[];
  var $=function(id){return document.getElementById(id)};
  var KEY='money-calc-v1';
  function save(){try{localStorage.setItem(KEY,JSON.stringify({start:$('start').value,items:items}))}catch(e){}}
  function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){$('start').value=d.start||'';items=Array.isArray(d.items)?d.items:[]}}catch(e){}}
  var fmt=function(n){return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})};

  function render(){
    var start=parseFloat($('start').value)||0;
    var spent=items.reduce(function(s,i){return s+i.amt},0);
    var left=start-spent;
    var big=$('left');
    big.textContent=fmt(left);
    big.className='big'+(left<0?' neg':'');
    $('spentTxt').textContent='Spent '+fmt(spent);
    var pct=start>0?Math.round(spent/start*100):0;
    $('pct').textContent=pct+'% used';
    $('bar').className='bar'+(left<0?' over':'');
    $('bar').firstChild.style.width=Math.min(pct,100)+'%';

    var ul=$('list');ul.innerHTML='';
    items.forEach(function(it,idx){
      var li=document.createElement('li');
      var a=document.createElement('span');a.textContent=it.name||'No label';if(!it.name)a.style.color='var(--mute)';
      var r=document.createElement('span');
      r.textContent=fmt(it.amt)+' ';
      var x=document.createElement('button');x.className='ghost';x.textContent='Remove';
      x.setAttribute('aria-label','Remove '+(it.name||'expense'));
      x.onclick=function(){items.splice(idx,1);render()};
      r.appendChild(x);li.appendChild(a);li.appendChild(r);ul.appendChild(li);
    });
    $('empty').style.display=items.length?'none':'block';
    save();
  }

  function add(){
    var amt=parseFloat($('amt').value);
    if(!(amt>0)){$('amt').focus();return}
    items.push({name:$('name').value.trim(),amt:amt});
    $('name').value='';$('amt').value='';$('amt').focus();
    render();
  }

  $('add').onclick=add;
  ['amt','name'].forEach(function(id){$(id).addEventListener('keydown',function(e){if(e.key==='Enter')add()})});
  $('start').addEventListener('input',render);
  $('clear').onclick=function(){items=[];render()};
  load();render();
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
